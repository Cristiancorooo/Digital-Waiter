databases:
  - name: digital-waiter-db
    plan: free
    databaseName: digital_waiter
    user: digital_waiter

services:
  - type: web
    name: digital-waiter-cristian
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_SYNC
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://digital-waiter-cristian.onrender.com,capacitor://localhost,http://localhost
      - key: DATABASE_URL
        fromDatabase:
          name: digital-waiter-db
          property: connectionString
