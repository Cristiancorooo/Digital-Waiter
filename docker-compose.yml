services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-waiter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_waiter
      POSTGRES_USER: digital_waiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digital_waiter_dev}
    ports:
      - "55432:5432"
    volumes:
      - digital_waiter_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_waiter -d digital_waiter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./digital-waiter-back
    container_name: digital-waiter-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: digital_waiter
      DB_USER: digital_waiter
      DB_PASSWORD: ${POSTGRES_PASSWORD:-digital_waiter_dev}
      DB_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      CORS_ORIGIN: http://localhost:4200,http://127.0.0.1:4200,https://localhost,capacitor://localhost
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./digital-waiter-front
    container_name: digital-waiter-web
    restart: unless-stopped
    ports:
      - "8099:80"
    depends_on:
      - backend

volumes:
  digital_waiter_data:
